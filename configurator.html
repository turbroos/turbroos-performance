<main class="container section config-page">
  <h1 class="page-title">Fahrzeug-Konfigurator</h1>

    Wähle Marke, Modell, Baujahr und Motorisierung. Alle Werte sind unverbindliche Richtwerte.

  <div class="cfg-shell">
    <div class="cfg-widget-head">
      <span class="cfg-dot"></span>
      <span>Chiptuning-Berechnungstool</span>
    </div>

    <div class="ecu-iframe-wrap">
      <iframe
        id="ecuFrame"
        class="ecu-iframe"
        src="ecu-widget.html"
        title="Chiptuning-Berechnungstool"
        loading="lazy"

<script>
(function () {
  const frame = document.getElementById("ecuFrame");
  if (!frame) return;

  // Start-Höhe
  frame.style.height = "1200px";

  function setHeight(h) {
    const n = Number(h);
    if (!Number.isFinite(n) || n < 400) return;
    frame.style.height = Math.ceil(n) + "px";
  }

  // Nachrichten vom Widget empfangen
  window.addEventListener("message", (ev) => {
    const data = ev.data;
    if (!data || data.type !== "ECU_WIDGET_HEIGHT") return;
    setHeight(data.height);
  });

  // Fallback falls keine Höhe gesendet wird
  frame.addEventListener("load", () => {
    setTimeout(() => {
      try {
        const iframeDoc = frame.contentDocument || frame.contentWindow.document;
        if (iframeDoc) {
          const h = iframeDoc.documentElement.scrollHeight;
          if (h > 400) frame.style.height = h + "px";
        }
      } catch (e) {
        // Zugriff blockiert → normal
      }
    }, 1000);
  });
})();
</script>

</body>
