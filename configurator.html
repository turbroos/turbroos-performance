<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .iframe-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* Aspect ratio for 16:9 */
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="your-source-url-here" allowfullscreen></iframe>
    </div>
</body>
</html>
