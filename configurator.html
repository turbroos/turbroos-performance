<head>

<link rel="stylesheet" href="css/style.css">

<style>
/* ===== Turbroos Widget Wrapper ===== */

.ecu-wrap{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  overflow:hidden;
}

#ecuCalculateTool{
  width:100%;
  background:#000;
}

/* Mobile Fix */
@media(max-width:820px){
  .ecu-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  #ecuCalculateTool{
    min-width:980px;
  }
}

/* Difference immer Turbroos Rot */
.ecu-wrap *{
  --turbroos-red:#960000;
}
</style>

</head>

<body class="page-configurator">

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img src="img/logo.png" alt="turbroos performance">

    <nav class="nav">

<p class="muted readable">
Wähle Marke, Modell, Baujahr und Motorisierung.
</p>

<div class="ecu-wrap">
  <div id="ecuCalculateTool"></div>
</div>

    <div>
      <strong>turbroos performance</strong><br>

    </div>
  </div>
</footer>

<!-- ===== XREMOVER SCRIPT ===== -->
<script>
window.$ecu = {
  lang: "de",
  width: "1100",
  BackgroundColor: "#000000",
  BoxColor: "#960000",
  FontColor: "#ffffff",
  ButtonColor: "#960000",
  ButtonFontColor: "#ffffff",
  APIID: ""
};

(function(){
  const s = document.createElement("script");
  s.src = "https://xremover.net/calculator/ecuob.js?_=" + Date.now();
  s.async = true;
  document.body.appendChild(s);
})();
</script>

<!-- ===== TURBROOS PATCH ===== -->
<script>
(function(){

  const RED = "#960000";
  const tool = document.getElementById("ecuCalculateTool");

  function fixWidget(){

    /* Difference Blau -> Rot */
    tool.querySelectorAll("*").forEach(el=>{
      const txt = (el.textContent||"").trim();
      const st = (el.getAttribute("style")||"").toLowerCase();

      if(txt.match(/^\d+(\.\d+)?\s?(hp|nm)$/i)){
        if(st.includes("blue") || st.includes("rgb(0")){
          el.style.color = RED;
        }
      }

      if((el.className||"").toLowerCase().includes("diff")){
        el.style.color = RED;
      }
    });

  }

  const observer = new MutationObserver(()=>{
    fixWidget();
  });

  observer.observe(tool,{childList:true,subtree:true});

  setTimeout(fixWidget,1500);
  setTimeout(fixWidget,3000);

})();
</script>

</body>
</html>
