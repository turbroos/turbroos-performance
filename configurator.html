<script>
(function () {
  const frame = document.getElementById("ecuFrame");
  if (!frame) return;

  // Start-Höhe erhöhen
  frame.style.height = window.innerWidth < 768 ? "2200px" : "1800px";

  function setHeight(h) {
    const n = Number(h);
    if (!Number.isFinite(n)) return;

    const minHeight = 1600; // Mindesthöhe
    const finalHeight = Math.max(n, minHeight);

    frame.style.height = finalHeight + "px";
  }

  // Nachrichten vom Widget empfangen
  window.addEventListener("message", (ev) => {
    const data = ev.data;
    if (!data || data.type !== "ECU_WIDGET_HEIGHT") return;
    setHeight(data.height);
  });

  // Fallback falls keine Höhe gesendet wird
  frame.addEventListener("load", () => {
    setTimeout(() => {
      try {
        const iframeDoc = frame.contentDocument || frame.contentWindow.document;
        if (iframeDoc) {
          const h = iframeDoc.body.scrollHeight;
          if (h > 400) setHeight(h);
        }
      } catch (e) {}
    }, 1500);
  });
})();
</script>
