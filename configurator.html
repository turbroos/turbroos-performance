<script>
  // iFrame Auto-Height (kein Abschneiden, Diagramm bleibt sichtbar)
  (function () {
    const frame = document.getElementById("ecuFrame");
    if (!frame) return;

    function setHeight(h) {
      const n = Number(h);
      if (!Number.isFinite(n) || n < 200) return;
      frame.style.height = Math.ceil(n) + "px";
    }

    window.addEventListener("message", (ev) => {
      // Wir akzeptieren nur Messages von der eigenen Seite (GitHub Pages Domain)
      // -> trotzdem robust: wir checken nur die Form der Daten
      const data = ev.data;
      if (!data || data.type !== "ECU_WIDGET_HEIGHT") return;
      setHeight(data.height);
    });

    // Fallback: falls Message spät kommt
    frame.addEventListener("load", () => {
      // Mindesthöhe, bis erstes Resize kommt
      frame.style.height = frame.style.height || "900px";
    });
  })();
</script>
