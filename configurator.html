<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fahrzeug-Konfigurator</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/configurator.css" />
</head>

<body class="page-configurator">
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img src="img/logo.png" alt="turbroos performance" />
    </a>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="configurator.html" class="active" aria-current="page">Konfigurator</a>
      <a href="about.html">Über uns</a>
      <a href="legal.html">Rechtliches</a>
    </nav>

    <div class="lang-switch" aria-hidden="true" style="opacity:0; pointer-events:none;">
      <button class="lang-btn" type="button">DE</button>
      <button class="lang-btn" type="button">EN</button>
    </div>
  </div>
</header>

<main class="container section config-page">
  <h1 class="page-title">Fahrzeug-Konfigurator</h1>
  <p class="muted readable">
    Wähle Marke, Modell, Baujahr und Motorisierung.
  </p>

  <!-- Turbroos Card -->
  <div class="cfg-shell">
    <div class="cfg-controls">
      <div class="cfg-hint">
        <span class="dot"></span>
        <span>Chiptuning-Berechnungstool (Widget)</span>
      </div>
    </div>

    <!-- WIDGET CARD (passt zum Design) -->
    <section class="ecu-card">
      <div class="ecu-card-inner">
        <div id="ecuCalculateTool" class="ecu-widget"></div>
      </div>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div>
      <strong>turbroos performance</strong><br />
      <span>Chiptuning &amp; Softwareoptimierung</span>
    </div>
    <div class="footer-links">
      <a href="legal.html">Rechtliches</a>
      <a href="about.html">Über uns</a>
      <a href="configurator.html" class="active">Konfigurator</a>
    </div>
  </div>
</footer>

<!-- ECU TOOL SCRIPT -->
<script>
  window.$ecu = {
    lang: "de",
    width: "1100",                 // interne Layoutbreite vom Widget
    BackgroundColor: "#000000",
    BoxColor: "#960000",
    FontColor: "#ffffff",
    ButtonColor: "#960000",
    ButtonFontColor: "#ffffff",
    APIID: ""
  };

  (function () {
    const s = document.createElement("script");
    s.src = "https://xremover.net/calculator/ecuob.js?_=" + Date.now();
    s.async = true;
    document.body.appendChild(s);
  })();
</script>

</body>
</html>
