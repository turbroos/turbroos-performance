        class="ecu-iframe"
        src="ecu-widget.html"

<script>
  (function () {
    const frame = document.getElementById("ecuFrame");
    if (!frame) return;

    frame.style.height = "1200px";
    frame.style.minHeight = "1200px";

    function setHeight(h) {
      const n = Number(h);
      if (!Number.isFinite(n) || n < 400) {
        console.warn("Invalid height received:", h);
        return;
      }
      console.log("Setting iframe height to:", n);
      frame.style.height = Math.ceil(n) + "px";
    }

    window.addEventListener("message", (ev) => {
      const data = ev.data;
      if (!data || data.type !== "ECU_WIDGET_HEIGHT") return;
      
      console.log("Received height message:", data);
      setHeight(data.height);
    }, false);

    frame.addEventListener("load", () => {
      console.log("iFrame loaded");
      
      try {
        setTimeout(() => {
          const iframeDoc = frame.contentDocument || frame.contentWindow.document;
          if (iframeDoc) {
            const h = iframeDoc.documentElement.scrollHeight;
            console.log("Direct height check:", h);
            if (h > 400) {
              frame.style.height = h + "px";
            }
          }
        }, 1000);
      } catch (e) {
        console.log("Cannot access iframe content (expected due to sandbox)");
      }
    });

    setTimeout(() => {
      if (frame.style.height === "1200px") {
        console.log("No height update received, keeping default height");
      }
    }, 3000);
  })();
</script>
