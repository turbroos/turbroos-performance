<!-- ECU TOOL SCRIPT -->
<script>
  // Empfehlung: width NICHT "100%" (das macht bei manchen Widgets Chaos),
  // sondern ein "Basis-Layout" und wir machen den Rest per CSS responsiv.
  window.$ecu = {
    lang: "de",
    width: "1100",
    BackgroundColor: "#000000",
    BoxColor: "#960000",
    FontColor: "#ffffff",
    ButtonColor: "#960000",
