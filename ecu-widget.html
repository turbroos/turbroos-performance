<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECU Widget</title>

<style>
  html, body{
    margin: 0;
    padding: 0;
    background: #000000;
  }

  #ecuCalculateTool{
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    background: #000000;
    min-height: 800px;
  }

  #ecuCalculateTool > div{
    background: #000000 !important;
  }

  #ecuCalculateTool{
    color: #ffffff;
  }

  body.loading::before {
    content: "Wird geladen...";
    display: block;
    text-align: center;
    padding: 40px;
    color: #888;
  }
</style>
</head>
<body class="loading">

  <div id="ecuCalculateTool"></div>

  <script>
    console.log("ecu-widget.html: Script started");

    window.$ecu = {
      lang: "de",
      width: "100%",
      BackgroundColor: "#000000",
      BoxColor: "#960000",
      FontColor: "#fff8f8",
      ButtonColor: "#960000",
      ButtonFontColor: "#ffffff",
      APIID: ""
    };

    (function() {
      const d = document;
      const s = d.createElement("script");
      s.src = "https://xremover.net/calculator/ecuob.js?_=" + Date.now();
      s.async = true;
      s.onerror = () => console.error("Failed to load XRemover widget");
      s.onload = () => console.log("XRemover widget loaded");
      d.body.appendChild(s);
    })();

    (function () {
      function postHeight() {
        const h = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.offsetHeight
        );
        
        console.log("Posting height:", h);
        
        try {
          window.parent.postMessage({ 
            type: "ECU_WIDGET_HEIGHT", 
            height: h 
          }, "*");
        } catch (e) {
          console.error("Failed to post message:", e);
        }
      }

      let tries = 0;
      const t = setInterval(() => {
        if (document.querySelector("#ecuCalculateTool") && 
            document.querySelector("#ecuCalculateTool").children.length > 0) {
          console.log("Widget detected, starting height tracking");
          document.body.classList.remove("loading");
          postHeight();
          clearInterval(t);
        }
        tries++;
        if (tries > 60) {
          console.log("Widget check timeout");
          document.body.classList.remove("loading");
          postHeight();
          clearInterval(t);
        }
      }, 500);

      const ro = new ResizeObserver(() => {
        postHeight();
      });
      
      try {
        ro.observe(document.documentElement);
      } catch (e) {
        console.log("ResizeObserver not available");
      }

      window.addEventListener("load", postHeight);
      document.addEventListener("DOMContentLoaded", postHeight);
      window.addEventListener("resize", postHeight);

      setInterval(postHeight, 2000);
    })();
  </script>

</body>
</html>
