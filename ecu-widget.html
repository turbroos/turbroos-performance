<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRemover</title>
</head>
<body>
    <script src="path/to/xremover.js"></script>
    <script>
        // Function to load the XRemover widget
        function loadXRemover() {
            const widget = document.createElement('div');
            widget.id = 'xremover-widget';
            widget.style.height = window.innerHeight + 'px'; // Adjust height
            document.body.appendChild(widget);

            // Instantiate XRemover widget
            XRemover.init(widget);
        }

        // Load the widget directly without loading state
        window.onload = loadXRemover;
    </script>
</body>
</html>
