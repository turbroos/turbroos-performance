<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECU Widget</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    #ecuCalculateTool {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      background: #000000;
    }
  </style>
</head>

<body>

  <div id="ecuCalculateTool"></div>

  <script>
    window.$ecu = {
      lang: "de",
      width: "100%",
      BackgroundColor: "#000000",
      BoxColor: "#960000",
      FontColor: "#fff8f8",
      ButtonColor: "#960000",
      ButtonFontColor: "#ffffff",
      BorderRadius: "0px",
      AutoHeight: true,
      APIID: ""
    };

    (function () {
      const script = document.createElement("script");
      script.src = "https://xremover.net/calculator/ecuob.js";
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>

</body>
</html>
