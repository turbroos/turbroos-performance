<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECU Widget</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Desktop-Breite im iFrame erzwingen, aber groß auf dem Handy anzeigen */
    body {
      width: 1200px;              /* Widget denkt: großer Bildschirm */
      transform: scale(0.55);     /* Große Darstellung auf dem Handy */
      transform-origin: top left; /* Skalierung von oben links */
    }

    #ecuCalculateTool {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #000000;
    }

    #ecuCalculateTool > div {
      background: #000000 !important;
    }
  </style>
</head>

<body>

  <div id="ecuCalculateTool"></div>

  <script>
    window.$ecu = {
      lang: "de",
      width: "100%",
      BackgroundColor: "#000000",
      BoxColor: "#960000",
      FontColor: "#fff8f8",
      ButtonColor: "#960000",
      ButtonFontColor: "#ffffff",
      APIID: ""
    };

    (function () {
      const script = document.createElement("script");
      script.src = "https://xremover.net/calculator/ecuob.js?_=" + Date.now();
      script.async = true;

      script.onerror = () => {
        console.error("ECU Widget Script konnte nicht geladen werden.");
        sendHeightUpdate();
      };

      document.body.appendChild(script);
    })();

    function sendHeightUpdate() {
      const height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      );

      window.parent.postMessage(
        { type: "ECU_WIDGET_HEIGHT", height: height },
        "*"
      );
    }

    (function () {
      let attempts = 0;

      const interval = setInterval(() => {
        sendHeightUpdate();
        attempts++;
        if (attempts > 40) clearInterval(interval);
      }, 250);

      const resizeObserver = new ResizeObserver(() => sendHeightUpdate());
      resizeObserver.observe(document.documentElement);

      window.addEventListener("load", sendHeightUpdate);
      document.addEventListener("DOMContentLoaded", sendHeightUpdate);
    })();
  </script>

</body>
</html>
