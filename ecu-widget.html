<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <!-- Desktop-Ansicht erzwingen, damit das Leistungsdiagramm IMMER angezeigt wird -->
  <meta name="viewport" content="width=1200, initial-scale=0.35" />

  <title>ECU Widget</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    #ecuCalculateTool {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #000000;
    }

    #ecuCalculateTool > div {
      background: #000000 !important;
    }
  </style>
</head>

<body>

  <div id="ecuCalculateTool"></div>

  <script>
    // Widget-Konfiguration
    window.$ecu = {
      lang: "de",
      width: "100%",
      BackgroundColor: "#000000",
      BoxColor: "#960000",
      FontColor: "#fff8f8",
      ButtonColor: "#960000",
      ButtonFontColor: "#ffffff",
      APIID: ""   // Falls du eine API-ID hast → hier eintragen
    };

    // Externes Script laden
    (function () {
      const script = document.createElement("script");
      script.src = "https://xremover.net/calculator/ecuob.js?_=" + Date.now();
      script.async = true;

      script.onerror = () => {
        console.error("ECU Widget Script konnte nicht geladen werden.");
        sendHeightUpdate();
      };

      document.body.appendChild(script);
    })();

    // Höhe an Parent melden
    function sendHeightUpdate() {
      const height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      );

      window.parent.postMessage(
        { type: "ECU_WIDGET_HEIGHT", height: height },
        "*"
      );
    }

    // Regelmäßige Updates nach dem Laden
    (function () {
      let attempts = 0;

      const interval = setInterval(() => {
        sendHeightUpdate();
        attempts++;
        if (attempts > 40) clearInterval(interval);
      }, 250);
